# Render Blueprint for the public demo (https://render.com/docs/blueprint-spec).
# Free plan: the service sleeps when idle and its disk is not persistent, so the
# demo database is recreated and re-seeded on every start.
services:
  - type: web
    name: myziel-demo
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: SESSION_HTTPS_ONLY
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_JSON
        value: "true"
