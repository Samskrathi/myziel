{% extends "base.html" %}
{% block title %}Set up myZiel{% endblock %}
{% block content %}
<h1>Welcome to myZiel</h1>
<p class="muted">Create the account for this installation. v1 is single-user.</p>
<form method="post" action="/setup" class="card">
  <div class="field"><label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email"></div>
  <div class="field"><label for="password">Password (8+ characters)</label>
    <input id="password" name="password" type="password" minlength="8" required
           autocomplete="new-password"></div>
  <div class="field"><label for="timezone">Timezone</label>
    <select id="timezone" name="timezone" required>
      {% for tz in timezones %}<option value="{{ tz }}">{{ tz }}</option>{% endfor %}
    </select>
    <p class="muted">Your check-in day and reminders follow this timezone.</p></div>
  <button type="submit">Create account</button>
</form>
{% endblock %}
{% block scripts %}
<script>
  // Preselect the browser's timezone.
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const sel = document.getElementById("timezone");
    if ([...sel.options].some(o => o.value === tz)) sel.value = tz;
  } catch (e) {}
</script>
{% endblock %}
