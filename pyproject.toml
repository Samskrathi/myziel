[project]
name = "myziel"
version = "0.1.0"
description = "Personal goal tracking with daily check-ins"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "pydantic-settings",
    "jinja2",
    "python-multipart",
    "apscheduler",
    "httpx",
    "passlib[bcrypt]",
    "pywebpush",
    "structlog",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myziel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
